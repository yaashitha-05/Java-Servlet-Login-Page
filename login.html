<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Login Page</title>
</head>
<style>

        body{
            font-family: Arial;
            text-align:center;
            margin-top:100px;
        }

        input{
            padding:10px;
            margin:10px;
        }

        button{
            padding:10px 20px;
        }

</style>
<body>
	<h2>Login Form</h2>
	<form action="login" method="post">

    User name:
    <input type="text" name="username" placeholder="Enter Username"
               required><br><br>

    Password:
    <input type="password" name="password" placeholder="Enter Password"
               required><br><br>

    <button type="submit">Login</button>

</form>

</body>
</html>
